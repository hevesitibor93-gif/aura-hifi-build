
name: AURA Hi-Fi APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - restore/classic-only
      - feature/aura-studio-theme

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout BLACK-ONIX source assets
        uses: actions/checkout@v4
        with:
          ref: black-onix-assets
          path: black-onix-assets

      - name: Import selected BLACK-ONIX textures
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp black-onix-assets/ScreenMain.Texture.png app/src/main/res/drawable-nodpi/black_onix_main_texture.png
          cp black-onix-assets/Images/ScreenEQ.Texture.png app/src/main/res/drawable-nodpi/black_onix_eq_texture.png
          cp black-onix-assets/Images/ScreenPL.Texture.png app/src/main/res/drawable-nodpi/black_onix_playlist_texture.png
          cp black-onix-assets/Images/VULeftL.Skin.png app/src/main/res/drawable-nodpi/black_onix_vu_left_l.png
          cp black-onix-assets/Images/VULeftR.Skin.png app/src/main/res/drawable-nodpi/black_onix_vu_left_r.png
          cp black-onix-assets/Images/VURightL.Skin.png app/src/main/res/drawable-nodpi/black_onix_vu_right_l.png
          cp black-onix-assets/Images/VURightR.Skin.png app/src/main/res/drawable-nodpi/black_onix_vu_right_r.png
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("black-onix-assets/Images")
          target = Path("app/src/main/res/drawable-nodpi")
          sprites = {
              "ButtonPrev.Skin.png": ("black_onix_prev", 8),
              "ButtonPlay.Skin.png": ("black_onix_play", 12),
              "ButtonPause.Skin.png": ("black_onix_pause", 12),
              "ButtonNext.Skin.png": ("black_onix_next", 8),
          }
          for filename, (name, frames) in sprites.items():
              image = Image.open(source / filename).convert("RGBA")
              frame_height = image.height // frames
              if image.height % frames:
                  raise SystemExit(f"Unexpected sprite dimensions: {filename} {image.size}")
              for state, index in (("normal", 0), ("pressed", 1)):
                  frame = image.crop((0, index * frame_height, image.width, (index + 1) * frame_height))
                  frame.save(target / f"{name}_{state}.png", optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res/drawable-nodpi/black_onix_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Import selected BLACK-ONIX skin textures"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Import complete BLACK-ONIX player layers and meters
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("black-onix-assets/Images")
          target = Path("app/src/main/res/drawable-nodpi")
          target.mkdir(parents=True, exist_ok=True)
          prefixes = (
              "Base", "Container", "PanelBottom", "BottomGW", "LeftGW", "RightGW",
              "ScreenMain", "RunningLine", "TimeDisplay", "VU_Mode", "PPM_Mode", "VULeft", "VURight",
              "SpectrumA1", "SpecModeA", "ButtonStop", "ButtonOpen", "ButtonSleep",
              "ButtonShuffle", "ButtonRepeat", "ButtonManager", "ButtonLibrary", "ButtonRadio", "PLScr", "EQScr", "VUPPMMode", "ButtonTopMainMenu", "ButtonTopOptions",
              "ButtonTopUtilities", "CloseBtn", "ToTrayBtn"
          )
          imported = 0
          for path in sorted(source.glob("*.png")):
              if not path.name.startswith(prefixes):
                  continue
              stem = path.name[:-4]
              stem = re.sub(r"([A-Z]+)([A-Z][a-z])", r"\1_\2", stem)
              stem = re.sub(r"([a-z0-9])([A-Z])", r"\1_\2", stem)
              resource = re.sub(r"[^a-zA-Z0-9]+", "_", stem).strip("_").lower()
              if not resource or not resource[0].isalpha():
                  continue
              path_out = target / f"onix_{resource}.png"
              path_out.write_bytes(path.read_bytes())
              imported += 1
          print(f"Imported {imported} original BLACK-ONIX image assets")
          if imported < 40:
              raise SystemExit("BLACK-ONIX asset import unexpectedly incomplete")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare persistent signing key
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          test -n "$AURIX_KEYSTORE_BASE64" || (echo "Missing AURIX_KEYSTORE_BASE64 secret" && exit 1)
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurix-release.jks"
          test -s "$RUNNER_TEMP/aurix-release.jks"

      - name: Build debug APK with persistent signature
        env:
          AURIX_KEYSTORE_PATH: ${{ runner.temp }}/aurix-release.jks
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          test -n "$AURIX_KEYSTORE_PASSWORD" || (echo "Missing AURIX_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$AURIX_KEY_ALIAS" || (echo "Missing AURIX_KEY_ALIAS secret" && exit 1)
          test -n "$AURIX_KEY_PASSWORD" || (echo "Missing AURIX_KEY_PASSWORD secret" && exit 1)
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-HiFi-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
