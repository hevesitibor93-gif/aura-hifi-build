
name: AURA Hi-Fi APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/mplay-theme-safe

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Prepare persistent signing key
        env:
          AURIX_KEYSTORE_BASE64: ${{ secrets.AURIX_KEYSTORE_BASE64 }}
        run: |
          test -n "$AURIX_KEYSTORE_BASE64" || (echo "Missing AURIX_KEYSTORE_BASE64 secret" && exit 1)
          echo "$AURIX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurix-release.jks"
          test -s "$RUNNER_TEMP/aurix-release.jks"

      - name: Build debug APK with persistent signature
        env:
          AURIX_KEYSTORE_PATH: ${{ runner.temp }}/aurix-release.jks
          AURIX_KEYSTORE_PASSWORD: ${{ secrets.AURIX_KEYSTORE_PASSWORD }}
          AURIX_KEY_ALIAS: ${{ secrets.AURIX_KEY_ALIAS }}
          AURIX_KEY_PASSWORD: ${{ secrets.AURIX_KEY_PASSWORD }}
        run: |
          test -n "$AURIX_KEYSTORE_PASSWORD" || (echo "Missing AURIX_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$AURIX_KEY_ALIAS" || (echo "Missing AURIX_KEY_ALIAS secret" && exit 1)
          test -n "$AURIX_KEY_PASSWORD" || (echo "Missing AURIX_KEY_PASSWORD secret" && exit 1)
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AURA-HiFi-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
