name: Inspect BLACK-ONIX skin assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'BLACK-ONIX-Images.zip'
      - '.github/workflows/inspect-onix-skin.yml'
    branches:
      - feature/audio-lab-menu
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original skin image assets
        run: |
          mkdir -p /tmp/onix-assets
          unzip -q BLACK-ONIX-Images.zip -d /tmp/onix-assets
          find /tmp/onix-assets -type f | sort > /tmp/onix-assets-list.txt
          echo "Extracted files:"
          cat /tmp/onix-assets-list.txt
          echo "Volume-related files:"
          grep -Ei 'vol|knob|dial|rotary|button' /tmp/onix-assets-list.txt || true
          mkdir -p onix-skin-extract
          cp /tmp/onix-assets-list.txt onix-skin-extract/
          find /tmp/onix-assets -type f \( -iname '*vol*' -o -iname '*knob*' -o -iname '*dial*' -o -iname '*rotary*' -o -iname '*button*' -o -iname '*slider*' \) -exec cp --parents {} onix-skin-extract/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: BLACK-ONIX-Original-Volume-Assets
          path: onix-skin-extract/
          if-no-files-found: error
