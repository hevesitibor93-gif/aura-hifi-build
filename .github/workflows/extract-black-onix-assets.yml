name: Extract BLACK-ONIX assets

on:
  push:
    branches:
      - black-onix-assets

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out asset branch
        uses: actions/checkout@v4
        with:
          ref: black-onix-assets
      - name: Extract uploaded skin resources
        run: |
          test -f BLACK-ONIX-Images.zip
          unzip -o BLACK-ONIX-Images.zip -d .
      - name: Commit extracted resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images Fonts *.xml
          if git diff --cached --quiet; then
            echo "No extracted resource changes."
            exit 0
          fi
          git commit -m "Extract BLACK-ONIX skin resources"
          git push origin HEAD:black-onix-assets
