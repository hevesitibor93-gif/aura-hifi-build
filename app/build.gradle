
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.aura.hifi'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aura.hifi'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.4'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("AURIX_KEYSTORE_PATH") ?: "")
            storePassword System.getenv("AURIX_KEYSTORE_PASSWORD")
            keyAlias System.getenv("AURIX_KEY_ALIAS")
            keyPassword System.getenv("AURIX_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
